<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">

  <!-- Saffron -->
  <rect width="900" height="200" y="0" fill="#FF9933"/>

  <!-- White -->
  <rect width="900" height="200" y="200" fill="#FFFFFF"/>

  <!-- Green -->
  <rect width="900" height="200" y="400" fill="#138808"/>

  <!-- Ashoka Chakra -->
  <g transform="translate(450,300)">
    <circle r="70" fill="none" stroke="#000080" stroke-width="6"/>

    <!-- 24 Spokes -->
    <g stroke="#000080" stroke-width="3">
      <line x1="0" y1="-70" x2="0" y2="70"/>
      <line x1="-70" y1="0" x2="70" y2="0"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(15)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(30)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(45)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(60)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(75)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(90)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(105)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(120)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(135)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(150)"/>
      <line x1="0" y1="-70" x2="0" y2="70" transform="rotate(165)"/>
    </g>
  </g>

</svg>
