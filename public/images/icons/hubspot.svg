    <circle cx="30" cy="30" r="8" stroke="none"/>
    <circle cx="60" cy="5" r="5" stroke="none"/>
    <circle cx="5" cy="60" r="5" stroke="none"/>
    <circle cx="60" cy="60" r="5" stroke="none"/>
    <line x1="30" y1="30" x2="60" y2="5"/>
    <line x1="30" y1="30" x2="5" y2="60"/>
    <line x1="30" y1="30" x2="60" y2="60"/>
  </g>

  <!-- Company Name -->
  <text x="100" y="50"
        font-family="Arial, Helvetica, sans-serif"
        font-size="36"
