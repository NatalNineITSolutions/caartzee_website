    <circle cx="20" cy="20" r="6"/>
    <rect x="18" y="0" width="4" height="40"/>
    <rect x="0" y="18" width="40" height="4"/>
    <rect x="6" y="6" width="4" height="28" transform="rotate(45 20 20)"/>
